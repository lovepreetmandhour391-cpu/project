<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lovepreet | Portfolio</title>

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#222;
    color:white;
}

/* NAVBAR */
.nav{
    width:100%;
    height:80px;
    background:black;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    padding:0 40px;
    position:sticky;
    top:0;
    z-index:10;
    border-bottom:2px solid purple;
    box-shadow:0 0 15px purple;
}

.nav ul{
    list-style:none;
    display:flex;
    gap:40px;
}

.nav ul li a{
    color:rgb(221,33,196);
    text-decoration:none;
    font-size:20px;
    font-weight:bold;
    padding:8px 15px;
    border-radius:20px;
    transition:0.4s;
}

.nav ul li a:hover{
    background:linear-gradient(45deg, purple, pink);
    transform:scale(1.2);
}

/* HERO SECTION */
.hero{
    width:90%;
    height:600px;
    background:#333;
    margin:40px auto;
    border-radius:30px;
    padding:50px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 0 40px purple;
}

/* Text */
.hero-text small{
    font-size:25px;
    color:#ccc;
}

.hero-text h1{
    font-size:70px;
    margin:10px 0;
}

.hero-text .highlight{
    color:rgb(255,23,255);
    text-shadow:0 0 10px purple;
}

.role{
    font-size:35px;
    margin-top:10px;
    animation:fade 2s infinite alternate;
}

@keyframes fade{
    from{ opacity:0.5 }
    to{ opacity:1 }
}

.explore-btn{
    margin-top:30px;
    width:160px;
    height:45px;
    font-size:20px;
    border:none;
    border-radius:25px;
    background:linear-gradient(45deg, purple, rgb(47, 43, 43));
    cursor:pointer;
    color:white;
    transition:0.3s;
}

.explore-btn:hover{
    transform:scale(1.1);
    box-shadow:0 0 20px pink;
}

/* IMAGE BOX */
.hero-img{
    width:400px;
    height:400px;
    border-radius:30px;
  
    background-size:cover;
    background-position:center;
    border:4px solid white;
    box-shadow:0 0 20px white, 0 0 60px purple;
}

/* Projects Section */
#projects{
    width:90%;
    margin:70px auto;
    text-align:center;
}

#projects h2{
    font-size:50px;
    margin-bottom:20px;
}

.project-box{
    width:100%;
    display:flex;
    justify-content:center;
    gap:40px;
    flex-wrap:wrap;
}

.card{
    width:280px;
    height:200px;
    background:#444;
    border-radius:20px;
    box-shadow:0 0 20px purple;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:25px;
    transition:0.4s;
}

.card:hover{
    transform:translateY(-10px);
    box-shadow:0 0 40px pink;
}

/* JS Scroll Effect Target */
.hidden{
    opacity:0;
    transform:translateY(20px);
    transition:1s;
}

.show{
    opacity:1;
    transform:translateY(0);
}
.hero-img img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:30px;
}
.hero-img{
    width:400px;
    height:400px;
}


</style>
</head>

<body>

<!-- NAVBAR -->
<div class="nav">
    <ul>
        <li><a href="#hero">Home</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
</div>

<!-- HERO SECTION -->
<section class="hero" id="hero">
    <div class="hero-text">
        <small>Hi Everyone, My Name Is</small>
        <h1>Lovepreet <span class="highlight">Singh</span></h1>
        <p class="role">Frontend Developer</p>
        <button class="explore-btn" onclick="scrollToProjects()">Explore</button>
    </div>

    <div class="hero-img">
        <img src="123.jpg" alt="">
    </div>
</section>

<!-- PROJECTS -->
<section id="projects" class="hidden">
    <h2>My Projects</h2>

    <div class="project-box">
        <div class="card hidden">Project 1</div>
        <div class="card hidden">Project 2</div>
        <div class="card hidden">Project 3</div>
        <div class="card hidden">Project 4</div>
    </div>
</section>

<script>
/* Button Scroll */
function scrollToProjects(){
    document.getElementById("projects").scrollIntoView({ behavior:"smooth" });
}

/* Scroll Animation */
const observer = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
        if(entry.isIntersecting){
            entry.target.classList.add('show');
        }
    });
});

document.querySelectorAll('.hidden').forEach((el)=> observer.observe(el));
</script>

</body>
</html>
